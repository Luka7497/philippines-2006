<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2006 필리핀 비전트립 지도</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f4f6; --surface:#fff; --ink:#24202a; --muted:#6c6573; --line:#e4dde3; --accent:#c2457e; --accent-soft:#f6dfea;
  --d1:#7a7f8c; --d2:#2f8f83; --d3:#d0782b; --d4:#3f62c7; --d5:#9b4fb4; --d6:#4d5560;
  --ok:#2c7a4b; --ok-bg:#e1f2e7; --est:#9a6a12; --est-bg:#f8edd6; --plan:#5d6470; --plan-bg:#ebedf0;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --display:"Gowun Batang",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--paper);display:grid;grid-template-columns:400px 1fr;height:100%;font-size:14.5px;line-height:1.55}
aside{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface);min-height:0}
.top{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-size:24px;margin:2px 0 8px;line-height:1.2}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font:500 13px var(--body);cursor:pointer;color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.list{overflow-y:auto;padding:8px 18px 30px;flex:1}
.day{padding:12px 0 6px;border-bottom:1px solid var(--line)}
.dayhead{display:flex;align-items:center;gap:10px;cursor:pointer}
.dn{font-family:var(--display);font-size:22px;color:var(--c);width:26px}
.dt{font-weight:700;flex:1}
.route{font-size:12.5px;color:var(--muted);margin:2px 0 6px 36px}
.stop{margin-left:36px;padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.stop:hover{background:var(--paper)}
.stop.on{background:var(--accent-soft);border-color:var(--c)}
.st{display:flex;gap:8px;align-items:baseline}
.time{font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;min-width:42px}
.name{font-weight:700}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:4px}
.tag.확인{color:var(--ok);background:var(--ok-bg)} .tag.추정{color:var(--est);background:var(--est-bg)} .tag.일정표{color:var(--plan);background:var(--plan-bg)}
.note{color:var(--muted);font-size:13px;margin:2px 0 6px 50px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-left:50px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;font:500 12.5px var(--body);cursor:pointer;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--c);border-color:var(--c);color:#fff}
details{margin:6px 0 4px 36px;font-size:12.5px;color:var(--muted)}
details p{background:var(--accent-soft);color:var(--ink);padding:8px 10px;border-radius:8px;margin:6px 0 0}
main{position:relative;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar b{font-size:15px}
.bar .sp{flex:1}
iframe{border:0;width:100%;flex:1;min-height:400px;background:#e8eef1}
.tip{font-size:12px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  main{order:-1;height:62vh;position:sticky;top:0;z-index:2}
  aside{border-right:0}
  .list{overflow:visible}
}
</style>
</head>
<body>
<aside>
  <div class="top">
    <div class="eyebrow">2006년 8월 첫째 주 · 청년부 단기선교</div>
    <h1>필리핀 비전트립</h1>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="list" id="list"></div>
</aside>
<main>
  <div class="bar"><b id="cap">전체 일정</b><span class="sp"></span><a class="btn" id="open" target="_blank" rel="noopener">구글지도 앱/웹에서 크게 열기</a></div>
  <iframe id="map" title="구글 지도" allowfullscreen loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe>
</main>

const frame=document.getElementById('map'), cap=document.getElementById('cap'), open=document.getElementById('open');
const ll=k=>LL[k].join(',');
function show(embed, link, title){ frame.src=embed; open.href=link; cap.textContent=title; }
function placeView(s, title){
  const q = s.q || s.n;
  const embed='https://maps.google.com/maps?q='+encodeURIComponent(q)+'&ll='+ll(s.k)+'&z=15&output=embed';

  show(embed, link, title||s.n);
}

}
function routeView(d){
  const ks=d.rk; const s=ll(ks[0]); const rest=ks.slice(1).map(ll).join('+to:');

}
function overview(){
  show('https://maps.google.com/maps?ll=14.62,120.85&z=9&output=embed','https://www.google.com/maps/@14.62,120.85,9z','전체 일정 · 루손 중부');
}
const routeKeys={mon:['naia','anti'],tue:['anti','jail','port'],wed:['anti','bacolor','subic','iram','olo'],thu:['subic','lawin','cali'],fri:['cali','pag','anti'],sat:['anti','naia']};
DATA.days.forEach(d=>d.rk=routeKeys[d.id]);
document.getElementById('tabs').innerHTML='<button class="tab" data-id="all" aria-pressed="true">전체</button>'+DATA.days.map(d=>`<button class="tab" data-id="${d.id}" style="--c:var(${d.color})" aria-pressed="false">${d.d}</button>`).join('');
document.getElementById('list').innerHTML=DATA.days.map(d=>`
 <section class="day" id="d-${d.id}" style="--c:var(${d.color})">
  <div class="dayhead" data-route="${d.id}"><span class="dn">${d.d}</span><span class="dt">${d.title}</span><button class="btn main" data-route="${d.id}">경로 보기</button></div>
  <div class="route">${d.dirlabel}${d.id==='tue'?' · 이후 배로 딸림섬 남단까지':''}</div>
  ${d.stops.map((s,i)=>`<div class="stop" ${s.k?`data-day="${d.id}" data-i="${i}"`:''}>
     <div class="st"><span class="time">${s.t}</span><span class="name">${s.n}<span class="tag ${s.s}">${s.s}</span></span></div>
     <div class="note">${s.note}</div>
     ${s.k?`<div class="acts"><button class="btn" data-act="place" data-day="${d.id}" data-i="${i}">지도·정보</button><button class="btn" data-act="sv" data-day="${d.id}" data-i="${i}">스트리트뷰</button><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.q||s.n)}${s.pid?'&query_place_id='+s.pid:''}">사진 더보기 ↗</a></div>`:''}
  </div>`).join('')}
  <details><summary>원본 시간표</summary><p>${d.sched}</p></details>
 </section>`).join('');
const find=(id,i)=>DATA.days.find(d=>d.id===id).stops[+i];
function mark(el){document.querySelectorAll('.stop.on').forEach(x=>x.classList.remove('on')); if(el) el.classList.add('on');}
function tab(id){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.id===id)));}
document.getElementById('list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-route],.stop[data-day]'); if(!b||e.target.closest('a')) return;
  if(b.dataset.route){ const d=DATA.days.find(x=>x.id===b.dataset.route); routeView(d); tab(d.id); mark(null); return; }
  const s=find(b.dataset.day,b.dataset.i); tab(b.dataset.day); mark(b.closest('.stop'));
  if(b.dataset.act==='sv') svView(s); else placeView(s);
});
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return; tab(t.dataset.id); mark(null);
  if(t.dataset.id==='all') overview(); else { const d=DATA.days.find(x=>x.id===t.dataset.id); routeView(d); document.getElementById('d-'+d.id).scrollIntoView({behavior:'smooth',block:'start'}); }
});
overview();
</script>
</body>
</html>
